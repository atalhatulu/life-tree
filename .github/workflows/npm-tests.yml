name: Life Tree 1000-life audit

on:
  push:
    branches:
      - ci/npm-tests-20260925
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all unit tests
        run: npm test
      - name: Simulate 1000 lives to age 100
        run: npm run simulate -- --lives 1000 --to-age 100 --policy random
      - name: Smoke test CLI syntax
        run: |
          node --check src/cli/play.js
          node --check src/cli/text_mode.js
          node --check src/cli/simulate.js

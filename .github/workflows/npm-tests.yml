name: Life Tree npm tests

on:
  push:
    branches:
      - ci/npm-tests-20260925
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all tests
        run: npm test
      - name: Smoke test CLI
        run: |
          node --check src/cli/play.js
          node --check src/cli/text_mode.js
          node --check src/cli/simulate.js

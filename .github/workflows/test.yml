name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/group6_part1.test.js tests/group6_part2.test.js
      - run: npm test
      - run: npm run fast-sim -- --lives 1000 --to-age 100 --policy human-like --seed-prefix final-1000-audit

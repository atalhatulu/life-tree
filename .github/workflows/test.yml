name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run fast-sim -- --lives 1000 --to-age 100 --policy random --seed-prefix ci-audit
      - run: npm run dump-lives -- --lives 1000 --to-age 100 --policy random --seed-prefix ci-audit --out artifacts/life-tree-1000-lives
      - uses: actions/upload-artifact@v4
        with:
          name: life-tree-1000-lives
          path: artifacts/life-tree-1000-lives
          retention-days: 14
      - run: npm run simulate -- --lives 300 --to-age 100 --policy random
      - run: npm run trace -- --seed editorial-life --policy random --to-age 100
      - run: npm run showcase

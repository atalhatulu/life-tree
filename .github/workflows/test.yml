name: tests

on:
  push:
    branches: [main, experiment/year-flow-v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/ui/app.js
      - run: node --check src/experimental/year_session.js
      - run: node --check experimental/year_flow_lab.js
      - run: node --check src/cli/text_mode.js
      - run: node --test tests/group6_part1.test.js tests/group6_part2.test.js
      - name: Play 25 years through experimental calendar
        run: node experimental/simulate_year_flow.js
      - run: npm test
      - name: Simulate 100 full lives
        run: npm run fast-sim -- --lives 100 --to-age 100 --policy random --seed-prefix phase2-life-audit

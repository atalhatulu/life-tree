name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/ui/app.js
      - run: node --check src/cli/text_mode.js
      - run: node --test tests/group6_part1.test.js tests/group6_part2.test.js
      - run: npm test
      - name: Simulate 1000 full lives
        run: npm run fast-sim -- --lives 1000 --to-age 100 --policy random --seed-prefix audit-1000-20260925

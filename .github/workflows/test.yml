name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/ui/app.js
      - run: node --check src/cli/text_mode.js
      - run: npm run test:web
      - run: npm run test:fast
      - run: npm run test:midlife

  sharded-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:shard -- ${{ matrix.shard }} 4

  simulation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simulate 1000 full lives
        run: npm run fast-sim -- --lives 1000 --to-age 100 --policy random --seed-prefix main-1000-audit

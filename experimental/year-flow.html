<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Tree · Yıllık Akış Laboratuvarı</title>
<style>
:root{font-family:system-ui,sans-serif;color:#243429;background:#e9efe9}*{box-sizing:border-box}body{margin:0;padding:20px}
main{max-width:440px;min-height:min(820px,94dvh);margin:auto;background:#fff;border-radius:22px;padding:20px;box-shadow:0 12px 50px #2342}
h1{font-size:21px;margin:0 0 6px}small{color:#65816b}.meta{display:flex;justify-content:space-between;gap:10px;margin:16px 0}
#date{font-size:29px;font-weight:800;font-variant-numeric:tabular-nums}progress{width:100%;height:12px;accent-color:#479c68}
button{border:1px solid #bfd7c5;background:#f0f8f2;border-radius:11px;padding:11px 14px;cursor:pointer;font:inherit}
button:disabled{opacity:.45;cursor:not-allowed}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
#feed{display:grid;gap:10px;max-height:42dvh;overflow:auto}.item{border:1px solid #e0e9e2;padding:12px;border-radius:12px;overflow-wrap:anywhere}.item strong{display:block;margin:4px 0}
#choices{display:grid;gap:8px;margin-top:12px}#choices button{text-align:left}#status{font-size:12px;color:#56745f}
</style></head><body><main>
<small>AYRI DENEY ALANI · main etkilenmez</small><h1>Hızlandırılmış yaşam yılı</h1>
<div class="meta"><span id="identity"></span><span id="age"></span></div>
<div id="date">1 Ocak 2027</div><progress id="progress" value="1" max="365"></progress>
<p id="status">Deney için yeni bir yıl başlat.</p>
<div class="controls"><button id="start">İlerle</button><button id="pause" disabled>Duraklat</button><button id="save" disabled>Kaydet</button><button id="load">Kaydı yükle</button><button id="reset">Yeni deneme</button><label>Hız <select id="speed"><option value="170">Normal</option><option value="65" selected>Hızlı</option><option value="20">Çok hızlı</option></select></label></div>
<section id="feed" aria-live="polite"></section>
</main><script type="module" src="./year_flow_lab.js"></script></body></html>

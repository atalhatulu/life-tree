<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Life Tree</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./src/ui/card_theme.css" />
</head>
<body>
  <main class="app-shell">
    <section class="phone-frame" aria-label="Life Tree oyun ekranı">
      <header class="topbar">
        <div class="identity-block">
          <div class="brand-row"><p class="eyebrow">LIFE TREE</p><span class="live-dot"></span></div>
          <h1 id="identity">Yeni hayat</h1>
          <p id="subtitle" class="subtitle"></p>
          <div class="identity-meta">
            <span id="lifePhaseChip" class="meta-chip">Başlangıç</span>
            <span id="goalQuick" class="meta-chip goal-chip">Hedef yok</span>
          </div>
        </div>
        <div class="header-actions"><button id="themeToggle" class="icon-button" type="button" aria-label="Kart görünümüne geç" aria-pressed="false" title="Kart görünümüne geç">✦</button><button id="newLife" class="icon-button" aria-label="Yeni hayat">↻</button></div>
      </header>

      <section class="stats" aria-label="Ana özellikler">
        <div class="stat"><span>Sağlık</span><div class="bar"><i id="healthBar"></i></div><b id="healthValue">0</b></div>
        <div class="stat"><span>Zeka</span><div class="bar"><i id="intelligenceBar"></i></div><b id="intelligenceValue">0</b></div>
        <div class="stat"><span>Görünüm</span><div class="bar"><i id="appearanceBar"></i></div><b id="appearanceValue">0</b></div>
        <div class="stat"><span>Mutluluk</span><div class="bar"><i id="happinessBar"></i></div><b id="happinessValue">0</b></div>
      </section>

      <section class="quick-strip" aria-label="Hızlı durum">
        <div><span>Para</span><b id="moneyQuick">₺0</b></div>
        <div><span>Borç</span><b id="debtQuick">₺0</b></div>
        <div><span>İş</span><b id="jobQuick">—</b></div>
        <div><span>Aile</span><b id="familyQuick">—</b></div>
      </section>

      <section id="screen" class="screen">
        <div id="lifeScreen" class="screen-panel active">
          <div id="eventCard" class="event-card hidden"></div>
          <div class="section-head"><h2>Hayat Akışı</h2><span id="seed"></span></div>
          <div id="timeline" class="timeline"></div>
        </div>

        <div id="relationshipsScreen" class="screen-panel">
          <div class="section-head"><h2>İlişkiler</h2></div>
          <div id="relationships"></div>
        </div>

        <div id="activitiesScreen" class="screen-panel">
          <div class="section-head"><h2>Aktiviteler</h2></div>
          <div id="activities"></div>
        </div>

        <div id="assetsScreen" class="screen-panel">
          <div class="section-head"><h2>Varlıklar</h2></div>
          <div id="assets"></div>
        </div>

        <div id="careerScreen" class="screen-panel">
          <div class="section-head"><h2>Eğitim & Kariyer</h2></div>
          <div id="career"></div>
        </div>

        <div id="treeScreen" class="screen-panel">
          <div class="section-head"><h2>Life Tree</h2></div>
          <div id="lifeTree"></div>
        </div>
      </section>

      <section class="age-zone">
        <div class="age-actions">
          <button id="ageUp" class="age-button">+1 YAŞ</button>
          <button id="autoLife" class="auto-button">▶ AUTO LIFE</button>
          <button id="simulateEnd" class="auto-button simulate-end-button">⏩ SONA SİMÜLE ET</button>
          <select id="autoSpeed" class="speed-select" aria-label="Auto Life hızı">
            <option value="700">Normal</option>
            <option value="420" selected>Hızlı</option>
            <option value="240">Çok hızlı</option>
          </select>
        </div>
      </section>

      <nav class="bottom-nav" aria-label="Ana menü">
        <button class="nav-item active" data-screen="lifeScreen"><span>●</span><small>Hayat</small></button>
        <button class="nav-item" data-screen="relationshipsScreen"><span>♡</span><small>İlişkiler</small></button>
        <button class="nav-item" data-screen="activitiesScreen"><span>＋</span><small>Yap</small></button>
        <button class="nav-item" data-screen="assetsScreen"><span>⌂</span><small>Varlıklar</small></button>
        <button class="nav-item" data-screen="careerScreen"><span>▣</span><small>Kariyer</small></button>
        <button class="nav-item" data-screen="treeScreen"><span>⑂</span><small>İzler</small></button>
      </nav>
    </section>

    <aside class="dev-panel">
      <label for="seedInput">Seed</label>
      <div class="seed-row"><input id="seedInput" placeholder="isteğe bağlı seed" /><button id="applySeed">Başlat</button></div>
      <p>Life Tree playable prototype • manuel kararlar + Auto Life.</p>
    </aside>
  </main>

  <script type="module" src="./src/ui/card_theme.js"></script>
  <script type="module" src="./src/ui/app.js"></script>
</body>
</html>
